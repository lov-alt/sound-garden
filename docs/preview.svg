<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/><stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#bg)" rx="12"/>

  <!-- Header -->
  <text x="30" y="36" fill="#fff" font-family="sans-serif" font-size="18" font-weight="300">Sound Garden</text>
  <text x="30" y="54" fill="#555" font-family="sans-serif" font-size="10">Microphone → frequency analysis → generative visual landscape</text>

  <!-- 4 mode panels -->
  <!-- Tree -->
  <rect x="30" y="76" width="405" height="195" fill="#0f0f15" rx="10" stroke="#1a1a2e" stroke-width="1"/>
  <text x="50" y="98" fill="#888" font-family="sans-serif" font-size="10" font-weight="500">Tree</text>
  <!-- Trunk -->
  <line x1="232" y1="261" x2="232" y2="200" stroke="#22c55e" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <!-- Branches -->
  <line x1="232" y1="200" x2="190" y2="170" stroke="#4ade80" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="232" y1="200" x2="270" y2="165" stroke="#a3e635" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="190" y1="170" x2="175" y2="145" stroke="#4ade80" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="190" y1="170" x2="205" y2="148" stroke="#84cc16" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="270" y1="165" x2="285" y2="140" stroke="#a3e635" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="270" y1="165" x2="255" y2="142" stroke="#4ade80" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- Wave -->
  <rect x="465" y="76" width="405" height="195" fill="#0f0f15" rx="10" stroke="#1a1a2e" stroke-width="1"/>
  <text x="485" y="98" fill="#888" font-family="sans-serif" font-size="10" font-weight="500">Wave</text>
  <path d="M 470 173 Q 500 130 530 173 Q 560 216 590 173 Q 620 130 650 173 Q 680 216 710 173 Q 740 130 770 173 Q 800 216 830 173 Q 860 130 865 162" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 470 173 Q 500 130 530 173 Q 560 216 590 173 Q 620 130 650 173 Q 680 216 710 173 Q 740 130 770 173 Q 800 216 830 173 Q 860 130 865 162" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" opacity="0.15"/>

  <!-- Particles -->
  <rect x="30" y="286" width="405" height="195" fill="#0f0f15" rx="10" stroke="#1a1a2e" stroke-width="1"/>
  <text x="50" y="308" fill="#888" font-family="sans-serif" font-size="10" font-weight="500">Particles</text>
  <circle cx="215" cy="85" r="6" fill="#6366f1" opacity="0.8"/>
  <circle cx="260" cy="100" r="4" fill="#818cf8" opacity="0.6"/>
  <circle cx="170" cy="95" r="5" fill="#a78bfa" opacity="0.65"/>
  <circle cx="230" cy="120" r="3" fill="#c084fc" opacity="0.45"/>
  <circle cx="195" cy="75" r="4" fill="#818cf8" opacity="0.5"/>
  <circle cx="245" cy="80" r="7" fill="#6366f1" opacity="0.7"/>
  <circle cx="155" cy="105" r="3" fill="#a78bfa" opacity="0.55"/>
  <circle cx="275" cy="90" r="3" fill="#c084fc" opacity="0.5"/>

  <!-- Circles -->
  <rect x="465" y="286" width="405" height="195" fill="#0f0f15" rx="10" stroke="#1a1a2e" stroke-width="1"/>
  <text x="485" y="308" fill="#888" font-family="sans-serif" font-size="10" font-weight="500">Circles</text>
  <circle cx="660" cy="155" r="75" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.12"/>
  <circle cx="660" cy="155" r="60" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.18"/>
  <circle cx="660" cy="155" r="45" fill="none" stroke="#a3e635" stroke-width="2" opacity="0.25"/>
  <circle cx="660" cy="155" r="30" fill="none" stroke="#84cc16" stroke-width="2" opacity="0.35"/>
  <circle cx="660" cy="155" r="15" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.5"/>

  <!-- Floating toolbar -->
  <rect x="275" y="445" width="350" height="42" fill="#1a1a1a" rx="14" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Mode buttons -->
  <rect x="292" y="454" width="56" height="24" fill="#ffffff" rx="8" opacity="0.1"/>
  <text x="320" y="470" fill="#fff" font-family="sans-serif" font-size="8" text-anchor="middle">🌳 Tree</text>
  <rect x="354" y="454" width="56" height="24" fill="transparent" rx="8"/>
  <text x="382" y="470" fill="#555" font-family="sans-serif" font-size="8" text-anchor="middle">🌊 Wave</text>
  <rect x="416" y="454" width="56" height="24" fill="transparent" rx="8"/>
  <text x="444" y="470" fill="#555" font-family="sans-serif" font-size="8" text-anchor="middle">✦ Particles</text>
  <rect x="478" y="454" width="56" height="24" fill="transparent" rx="8"/>
  <text x="506" y="470" fill="#555" font-family="sans-serif" font-size="8" text-anchor="middle">◎ Circles</text>
  <!-- Separators -->
  <line x1="540" y1="454" x2="540" y2="478" stroke="#333" stroke-width="1"/>
  <!-- Sensitivity -->
  <text x="550" y="468" fill="#555" font-family="sans-serif" font-size="7">Sensitivity</text>
  <line x1="604" y1="467" x2="625" y2="467" stroke="#333" stroke-width="1"/>
  <circle cx="612" cy="467" r="3" fill="#6366f1"/>
  <!-- Mic button -->
  <rect x="584" y="455" width="24" height="24" fill="#22c55e" rx="8" opacity="0.15"/>
  <text x="596" y="472" fill="#4ade80" font-family="sans-serif" font-size="10" text-anchor="middle">🎤</text>
</svg>
